<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portfolio Project Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">AAT Portfolio Project</p>
      <h1>Student Portfolio Project Tracker</h1>
      <p class="subtitle">Plan, track, and document academic software projects for GitHub portfolio submission.</p>
    </div>
    <button id="exportButton" class="primary-action" type="button">Export Summary</button>
  </header>

  <main>
    <section class="dashboard" aria-label="Project summary">
      <article>
        <span id="totalProjects">0</span>
        <p>Total projects</p>
      </article>
      <article>
        <span id="activeProjects">0</span>
        <p>Active projects</p>
      </article>
      <article>
        <span id="averageProgress">0%</span>
        <p>Average progress</p>
      </article>
      <article>
        <span id="nextDeadline">-</span>
        <p>Nearest deadline</p>
      </article>
    </section>

    <section class="workspace">
      <form id="projectForm" class="project-form">
        <h2>Add Project</h2>
        <label>
          Project title
          <input id="title" name="title" type="text" maxlength="80" required placeholder="Example: Library Management System">
        </label>
        <label>
          Objective
          <textarea id="objective" name="objective" maxlength="180" required placeholder="What problem does this project solve?"></textarea>
        </label>
        <div class="form-row">
          <label>
            Technology
            <input id="technology" name="technology" type="text" maxlength="60" required placeholder="HTML, CSS, JavaScript">
          </label>
          <label>
            Deadline
            <input id="deadline" name="deadline" type="date" required>
          </label>
        </div>
        <div class="form-row">
          <label>
            Progress
            <input id="progress" name="progress" type="number" min="0" max="100" value="25" required>
          </label>
          <label>
            Status
            <select id="status" name="status">
              <option>Planning</option>
              <option>Development</option>
              <option>Testing</option>
              <option>Completed</option>
            </select>
          </label>
        </div>
        <button type="submit">Save Project</button>
      </form>

      <section class="project-list" aria-label="Saved projects">
        <div class="list-toolbar">
          <h2>Portfolio Projects</h2>
          <select id="statusFilter" aria-label="Filter by status">
            <option value="All">All</option>
            <option value="Planning">Planning</option>
            <option value="Development">Development</option>
            <option value="Testing">Testing</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div id="projects" class="projects"></div>
      </section>
    </section>
  </main>

  <template id="projectCardTemplate">
    <article class="project-card">
      <div class="card-topline">
        <span class="status"></span>
        <button class="delete-button" type="button" aria-label="Delete project">Delete</button>
      </div>
      <h3></h3>
      <p class="objective"></p>
      <dl>
        <div>
          <dt>Technology</dt>
          <dd class="technology"></dd>
        </div>
        <div>
          <dt>Deadline</dt>
          <dd class="deadline"></dd>
        </div>
      </dl>
      <div class="progress-row">
        <span>Progress</span>
        <strong class="progress-value"></strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
